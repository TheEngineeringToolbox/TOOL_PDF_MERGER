name: Release v0.0.4

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate release
        id: gate
        shell: pwsh
        run: |
          $match = Select-String -Path app.py -Pattern '^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$'
          if (-not $match) { throw 'APP_VERSION niet gevonden.' }
          $version = $match.Matches[0].Groups[1].Value
          if ($version -ne '0.0.3') {
            'run=false' >> $env:GITHUB_OUTPUT
            Write-Host "Release-bootstrap overgeslagen: huidige versie is $version."
            exit 0
          }
          'run=true' >> $env:GITHUB_OUTPUT

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Bump source version and sync branches
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        run: |
          python build/build_exe.py --bump patch
          $match = Select-String -Path app.py -Pattern '^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$'
          $version = $match.Matches[0].Groups[1].Value
          if ($version -ne '0.0.4') { throw "Onverwachte releaseversie: $version" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Release v0.0.4'
          $releaseSha = git rev-parse HEAD
          git push origin HEAD:master
          git push origin HEAD:codex/development
          git tag -a "v$version" -m "TOOL PDF Merger v$version"
          git push origin "v$version"

          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          "RELEASE_SHA=$releaseSha" >> $env:GITHUB_ENV

      - name: Build checked release bundle
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        run: python build/build_exe.py

      - name: Publish GitHub release
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDir = Get-ChildItem -Path dist -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $releaseDir) { throw 'Release-outputmap ontbreekt.' }

          $zip = Join-Path $PWD "TOOL-PDF-Merger-$env:TAG.zip"
          Compress-Archive -Path (Join-Path $releaseDir.FullName '*') -DestinationPath $zip -Force

          $assets = @(Get-ChildItem -Path $releaseDir.FullName -File | ForEach-Object { $_.FullName })
          $assets += $zip

          $notes = @"
Deze patchrelease verwerkt het nieuwe licentiebeheer voor TOOL PDF Merger.

- Rechthebbende en licentiegever: TOOL Engineers B.V.
- Gratis gebruik, ook binnen bedrijven.
- Gratis ongewijzigde verspreiding met behoud van licentie en copyright.
- Geen verkoop, verhuur, betaald aanbieden of betaalde bundeling zonder schriftelijke toestemming.
- Derde-partijlicenties worden apart gecontroleerd en meegeleverd.

De release bevat naast de EXE ook LICENSE.txt, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.txt, dependencies.txt en build-info.json.
"@

          gh release create $env:TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:RELEASE_SHA --title "TOOL PDF Merger $env:TAG" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
